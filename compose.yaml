services:
  postgres:
    image: postgres:16
    container_name: lms-db
    environment:
      POSTGRES_DB: lms_main
      POSTGRES_USER: lms_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - lms_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  lms_postgres_data: